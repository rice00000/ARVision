// Builds ../yolo.aar: ./gradlew assembleRelease (needs ANDROID_HOME and JDK 17).
plugins {
    id 'com.android.library' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
}

android {
    namespace 'edu.mit.arvision.yolo'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    // Keep in step with ONNX_RUNTIME in ../yolo_plugin.gd, which adds it to the app.
    compileOnly 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
}

tasks.register('copyAar', Copy) {
    from layout.buildDirectory.file('outputs/aar/yolo-release.aar')
    into '..'
    rename { 'yolo.aar' }
    doNotTrackState('copies into the Godot addon folder')
}
afterEvaluate { tasks.named('assembleRelease') { finalizedBy 'copyAar' } }
